<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ACEIRT™ Academy — Course Player</title>
<style>
  body { margin: 0; font-family: Inter, Arial, sans-serif; background: #102d85; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #fff; border-radius: 16px; padding: 48px 40px; text-align: center; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  img { height: 48px; margin-bottom: 24px; }
  h1 { color: #102d85; font-size: 24px; font-weight: 800; margin: 0 0 8px; }
  p { color: #6b7280; font-size: 15px; margin: 0 0 32px; }
  .status { display: inline-flex; align-items: center; gap: 8px; background: rgba(12,54,228,0.08); color: #0c36e4; font-size: 13px; font-weight: 600; padding: 8px 18px; border-radius: 100px; }
  .dot { width: 8px; height: 8px; background: #0c36e4; border-radius: 50%; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
</style>
</head>
<body>
  <div class="card">
    <img src="https://storage.googleapis.com/msgsndr/SqO7aeEhM6QOT3YoHQNI/media/690f6d6fd7811a1405395e1c.png" alt="ACEIRT" />
    <h1>ACEIRT™ Academy<br>Course Player</h1>
    <p>Interactive HTML5 courses for ACEIRT™ Academy learners.<br>Access your courses through the ACEIRT™ Academy portal.</p>
    <div class="status"><div class="dot"></div> Platform Active</div>
  </div>
</body>
</html>
